<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page not found · HuaSheng</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f6f3;
      color: #111;
      font-family: "Inter", Arial, "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(560px, calc(100% - 40px));
      border: 1px solid #e2e2dc;
      border-radius: 8px;
      background: #fff;
      padding: 34px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 22px;
      color: #555;
      font-size: 16px;
      line-height: 1.75;
    }
    a {
      color: #1456b8;
      font-weight: 700;
      text-decoration: none;
    }
    [data-lang] { display: none; }
    [data-lang].active { display: block; }
  </style>
</head>
<body>
  <main>
    <div data-lang="en" class="active">
      <h1>Page not found</h1>
      <p>The page you are looking for has been moved or is no longer available. Return to our homepage or browse the latest project updates.</p>
      <a href="/en/">Back to homepage &rarr;</a>
    </div>
    <div data-lang="zh">
      <h1>页面已移除</h1>
      <p>该页面当前不可访问。请返回首页或浏览华盛最新项目动态。</p>
      <a href="/zh/">返回首页 &rarr;</a>
    </div>
  </main>
  <script>
    (function () {
      var path = location.pathname;
      var isZh = path.indexOf('/zh/') === 0 || path.indexOf('/blog/') === 0 || path.indexOf('/nansha-phase-2/') === 0;
      var en = document.querySelector('[data-lang="en"]');
      var zh = document.querySelector('[data-lang="zh"]');
      if (isZh) {
        en.classList.remove('active');
        zh.classList.add('active');
        document.documentElement.lang = 'zh-CN';
        document.title = '页面已移除 · HuaSheng';
      }
    })();
  </script>
</body>
</html>
